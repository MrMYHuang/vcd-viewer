<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>VCD Waveform Viewer</title>
    <link data-trunk rel="copy-file" href="assets/favicon.png"/>
    <link data-trunk rel="copy-file" href="assets/favicon.ico"/>
    <link rel="icon" type="image/png" href="favicon.png"/>
    <link data-trunk rel="rust" data-wasm-opt="2" />
    <style>
        html, body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
            background: #11111b;
        }
        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="vcd_viewer_canvas"></canvas>
</body>
</html>
